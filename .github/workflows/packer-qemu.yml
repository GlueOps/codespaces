name: Packer build qemu

on:
  workflow_run:
    workflows: ["Build and Publish devcontainer image"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      glueops_codespace_tag:
        description: 'Enter the github.com/glueops/codespaces tag to use (e.g. v0.60.0)'
        required: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: public-XXL
    timeout-minutes: 60
    steps:
      - name: Enable KVM group perms
        run: |
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm

      - name: Debug Print Ref Info
        run: |
          echo "inputs.glueops_codespace_tag: ${{ inputs.glueops_codespace_tag }}"
          echo "event.workflow_run.head_branch: ${{ github.event.workflow_run.head_branch }}"
          echo "event.workflow_run.head_sha: ${{ github.event.workflow_run.head_sha }}"
          echo "github.ref: ${{ github.ref }}"
          echo "event_name: ${{ github.event_name }}"
          
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.glueops_codespace_tag || github.event.workflow_run.head_sha }}

      - name: Setup packer
        uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        id: setup
        with:
          version: 1.16.1

      - name: Generate image password
        run: echo "IMAGE_PASSWORD=$(openssl rand -base64 16)" >> $GITHUB_ENV

      - name: Generate cloud-init data
        run: |
          echo '#cloud-config
          chpasswd:
            expire: False
            users:
            - {name: debian, password: '"$IMAGE_PASSWORD"', type: text}
          ssh_pwauth: True' > user-data
          echo '' > meta-data

      - name: Install runner dependencies
        run: sudo apt-get update && sudo apt-get install qemu-system genisoimage -y
      
      - name: Run packer init
        id: init
        run: packer init qemu.pkr.hcl

      - name: Run packer build
        id: build
        run: packer build -var glueops_codespaces_container_tag=${{ inputs.glueops_codespace_tag || github.event.workflow_run.head_branch }} -var image_password=${{ env.IMAGE_PASSWORD }} qemu.pkr.hcl
        env:
          PACKER_LOG: 1


      - id: install-aws-cli
        uses: unfor19/install-aws-cli-action@f5b46b7f32cf5e7ebd652656c5036bf83dd1e60c # v1
        with:
          version: 2
          verbose: false
          arch: amd64 

      - name: Upload the qcow2 to S3 and, split into 1024M parts, to GitHub Releases
        # tar -C, not mv: the background S3 upload is still reading images/$TAG.qcow2.
        # -P 4: one part upload at a time took ~4 min.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.S3_BUCKET_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.glueops_codespace_tag || github.event.workflow_run.head_branch }}
        run: |
          aws s3 cp "images/$TAG.qcow2" "s3://$S3_BUCKET/$TAG.qcow2" --acl public-read --no-progress &
          s3=$!
          tar -C images -cvf "$TAG.qcow2.tar" "$TAG.qcow2"
          split -b 1024M "$TAG.qcow2.tar" "$TAG.qcow2.tar.part_"
          printf '%s\0' ./*.qcow2.tar.part_* | xargs -0 -P 4 -I{} gh release upload "$TAG" {} --clobber --repo "$GITHUB_REPOSITORY"
          wait "$s3"
