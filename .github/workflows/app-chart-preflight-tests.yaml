name: app-chart-preflight tests
on:
  pull_request:
    paths:
      - '.devcontainer/tools/app-chart-preflight.sh'
      - '.devcontainer/tests/app-chart-preflight/**'
      - 'hack/test-app-chart-preflight.sh'
      - 'hack/test.sh'
      - '.github/workflows/app-chart-preflight-tests.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install shellcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q shellcheck
      - name: hack/test-app-chart-preflight.sh
        run: ./hack/test-app-chart-preflight.sh
